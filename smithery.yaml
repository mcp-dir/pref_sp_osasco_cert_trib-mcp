# Smithery configuration for Prefeitura SP Osasco: Certidão de Tributos de Empresa
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pref_sp_osasco_cert_trib

name: pref_sp_osasco_cert_trib-mcp
displayName: "Prefeitura SP Osasco: Certidão de Tributos de Empresa"
description: >
  Prefeitura SP Osasco: Certidão de Tributos de Empresa, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pref_sp_osasco_cert_trib-mcp
repository: https://github.com/mcp-dir/pref_sp_osasco_cert_trib-mcp

tags:
  - pref_sp_osasco_cert_trib
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pref_sp_osasco_cert_trib

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pref_sp_osasco_cert_trib/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
